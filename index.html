<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAT-RUSH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA INICIAL (MENU) -->
    <div id="tela-inicial" class="tela">
        <h1 class="titulo-jogo">MAT-RUSH</h1>
        <p class="subtitulo">Aventuras na Cidade: Explore a zona urbana e resolva os desafios!</p>
        <button id="btn-jogar" class="botao-principal">JOGAR</button>
    </div>

    <!-- TELA DO JOGO 2D -->
    <div id="tela-jogo" class="escondido">
        <!-- PAINEL DE STATUS FIXO -->
        <div id="painel-hud">
            <div>Pontos: <span id="pontuacao">0</span></div>
            <div>Vidas: <span id="vidas">❤️❤️❤️</span></div>
        </div>

        <!-- CANVAS COM TAMANHO DE JANELA ESTÁVEL -->
        <canvas id="canvas-jogo" width="800" height="600"></canvas>
    </div>

    <!-- SCRIPT PRINCIPAL DO JOGO -->
    <script src="script.js"></script>

</body>
</html>
